<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Arena — Multiplayer Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#0A0D1A;
    --panel:#11152A;
    --panel-2:#161B36;
    --edge: rgba(154,166,255,0.14);
    --edge-strong: rgba(154,166,255,0.28);
    --paper:#EFEDE6;
    --cyan:#2FE6D9;
    --magenta:#FF3E8C;
    --amber:#FFC145;
    --muted:#8891C7;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Manrope', sans-serif;
    color:var(--paper);
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(47,230,217,0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(255,62,140,0.10), transparent 55%),
      var(--stage);
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:36px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode:overlay;
  }

  .wrap{ width:100%; max-width:960px; position:relative; z-index:1; }

  .marquee{ text-align:center; margin-bottom:30px; }
  .marquee h1{
    font-family:'Bungee', sans-serif;
    font-weight:400;
    font-size:clamp(1.9rem, 5vw, 3rem);
    margin:0;
    letter-spacing:0.01em;
    background:linear-gradient(90deg, var(--cyan), var(--magenta) 65%, var(--amber));
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }
  .marquee .underline{
    width:min(420px, 70%);
    height:2px;
    margin:14px auto 0;
    background:linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    opacity:0.7;
  }
  .chips{
    display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--edge);
    color:var(--muted);
    background:rgba(255,255,255,0.02);
  }

  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--edge);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
    position:relative;
  }
  .panel::before, .panel::after{
    content:'';
    position:absolute; width:14px; height:14px;
    border-color:var(--edge-strong); border-style:solid; opacity:0.9;
  }
  .panel::before{ top:10px; left:10px; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
  .panel::after{ bottom:10px; right:10px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }

  label.field-label{
    display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px; font-weight:600;
  }
  input{
    width:100%; background:#0D1024; border:1px solid var(--edge); color:var(--paper);
    padding:12px 14px; border-radius:10px; font-family:inherit; font-size:0.95rem; margin-bottom:14px;
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(47,230,217,0.15); }
  input::placeholder{ color:#565f8f; }

  button{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:0.86rem;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    border:1px solid var(--edge);
    background:rgba(255,255,255,0.03);
    color:var(--paper);
    transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled){ transform:translateY(-1px); border-color:var(--edge-strong); }
  button:active:not(:disabled){ transform:translateY(0); }
  button:disabled{ opacity:0.35; cursor:default; transform:none; }
  button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  button.primary{
    background:linear-gradient(90deg, var(--cyan), #22C7BC);
    color:#04211E; border-color:transparent;
    box-shadow:0 0 0 rgba(47,230,217,0), 0 6px 20px -6px rgba(47,230,217,0.6);
  }
  button.primary:hover:not(:disabled){ box-shadow:0 6px 24px -4px rgba(47,230,217,0.75); }
  button.danger{
    border-color:rgba(255,62,140,0.4); color:var(--magenta); background:rgba(255,62,140,0.06);
  }
  button.danger:hover:not(:disabled){ border-color:var(--magenta); box-shadow:0 0 0 3px rgba(255,62,140,0.12); }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .full{ width:100%; }

  .divider-label{
    display:flex; align-items:center; gap:10px; margin:20px 0 14px;
    color:var(--muted); font-size:0.78rem; font-weight:600;
  }
  .divider-label::before, .divider-label::after{
    content:''; flex:1; height:1px; background:var(--edge);
  }

  .toast{ text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.74rem; color:var(--amber); min-height:18px; margin-top:4px; }

  .layout{ display:grid; grid-template-columns:1fr 280px; gap:16px; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } }

  .room-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .code-label{ font-size:0.8rem; color:var(--muted); }
  .code-badge{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:1.3rem; letter-spacing:0.18em;
    color:var(--amber); background:#0D1024; border:1px dashed var(--edge-strong);
    padding:8px 16px; border-radius:10px; display:inline-block; margin-left:8px;
  }

  .status{
    text-align:center; font-size:1.05rem; font-weight:600; margin:4px 0 18px; min-height:26px;
  }
  .status .x{ color:var(--cyan); } .status .o{ color:var(--magenta); }

  .scoreboard{
    display:flex; justify-content:center; gap:22px; margin-bottom:20px;
    font-family:'JetBrains Mono',monospace;
  }
  .scoreboard .slot{ text-align:center; }
  .scoreboard .slot .n{ display:block; font-size:0.68rem; color:var(--muted); margin-bottom:2px; }
  .scoreboard .slot .v{ font-size:1.4rem; font-weight:700; }
  .scoreboard .x .v{ color:var(--cyan); } .scoreboard .o .v{ color:var(--magenta); } .scoreboard .d .v{ color:var(--amber); }

  .cabinet{
    max-width:380px; margin:0 auto;
    padding:14px;
    border-radius:20px;
    background:linear-gradient(160deg, #1B2044, #0D1024);
    border:1px solid var(--edge-strong);
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.5), 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .board{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    background:#05060D; border-radius:12px; padding:8px; aspect-ratio:1;
  }
  .cell{
    background:var(--panel); border:1px solid var(--edge); border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope',sans-serif;
    font-size:clamp(1.8rem,8vw,2.7rem); font-weight:800; cursor:pointer; color:var(--paper);
    transition:background .15s ease, border-color .15s ease;
  }
  .cell:hover:not(:disabled){ border-color:var(--edge-strong); }
  .cell:disabled{ cursor:default; }
  .cell.x{ color:var(--cyan); text-shadow:0 0 18px rgba(47,230,217,0.45); }
  .cell.o{ color:var(--magenta); text-shadow:0 0 18px rgba(255,62,140,0.45); }
  .cell.win{ background:rgba(255,193,69,0.14); border-color:rgba(255,193,69,0.5); }

  .match-controls{ display:flex; justify-content:center; margin-top:18px; }

  .panel-heading{
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
    font-size:0.82rem; font-weight:700; color:var(--paper);
  }
  .panel-heading .dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); }

  .roster{ display:flex; flex-direction:column; gap:8px; }
  .person{
    display:flex; align-items:center; gap:9px; background:#0D1024; border:1px solid var(--edge);
    border-left:3px solid var(--edge); border-radius:9px; padding:9px 11px; font-size:0.85rem;
    transition:opacity .2s ease, border-color .2s ease;
  }
  .person.speaking{ border-color:var(--cyan); box-shadow:0 0 0 1px rgba(47,230,217,0.35), 0 0 16px -4px rgba(47,230,217,0.6); }
  .person.offline{ opacity:0.4; }

  .role-tag{
    font-family:'JetBrains Mono', monospace; font-size:0.62rem; font-weight:600; padding:3px 8px;
    border-radius:6px; margin-left:auto; white-space:nowrap;
  }
  .role-tag.player_x{ background:rgba(47,230,217,0.14); color:var(--cyan); }
  .role-tag.player_o{ background:rgba(255,62,140,0.14); color:var(--magenta); }
  .role-tag.spectator{ background:rgba(136,145,199,0.14); color:var(--muted); }
  .role-tag.host{ background:rgba(255,193,69,0.14); color:var(--amber); }

  .mic-dot{ width:8px; height:8px; border-radius:50%; background:#333a5e; flex-shrink:0; }
  .mic-dot.muted{ background:var(--magenta); }
  .mic-dot.on{ background:var(--cyan); box-shadow:0 0 8px rgba(47,230,217,0.8); }

  .offline-tag{ font-family:'JetBrains Mono',monospace; font-size:0.62rem; color:var(--muted); margin-left:auto; }

  .host-controls select{
    background:#0D1024; color:var(--paper); border:1px solid var(--edge); border-radius:7px;
    font-family:'JetBrains Mono',monospace; font-size:0.68rem; padding:4px 6px; cursor:pointer;
  }

  .pending-item{ display:flex; align-items:center; gap:6px; font-size:0.85rem; }
  .pending-item button{ padding:6px 12px; font-size:0.72rem; }

  .section-label{
    font-family:'JetBrains Mono', monospace; font-size:0.68rem; color:var(--amber);
    margin:16px 0 8px; font-weight:600;
  }

  @media (prefers-reduced-motion: reduce){
    .marquee h1{ animation:none; }
    button{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="marquee">
    <h1>X / O Nexus Arena</h1>
    <div class="underline"></div>
    <div class="chips">
      <span class="chip">Rooms</span>
      <span class="chip">Spectators</span>
      <span class="chip">Live voice</span>
    </div>
  </div>

  <!-- ENTRY SCREEN -->
  <div class="panel" id="entryCard">
    <label class="field-label" for="nameInput">Your display name</label>
    <input id="nameInput" placeholder="e.g. Kestrel" maxlength="24">
    <button class="primary full" id="createBtn">Create a room</button>

    <div class="divider-label">join an existing room</div>
    <label class="field-label" for="codeInput">Room code</label>
    <input id="codeInput" placeholder="e.g. 7QK2M" maxlength="8" style="text-transform:uppercase">
    <button class="full" id="joinBtn">Request to join</button>
    <div class="toast" id="entryToast"></div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="roomCard" style="display:none;">
    <div class="panel room-top">
      <div><span class="code-label">Room code</span><span class="code-badge" id="codeBadge"></span></div>
      <div class="row">
        <button id="micBtn">🎤 Enable mic</button>
        <button class="danger" id="leaveBtn">Leave room</button>
      </div>
    </div>
    <div class="toast" id="roomToast" style="margin-bottom:8px;"></div>

    <div class="layout">
      <div>
        <div class="panel">
          <div class="status" id="statusLine">Waiting in lobby…</div>
          <div class="scoreboard">
            <div class="slot x"><span class="n">Player X</span><span class="v" id="scoreX">0</span></div>
            <div class="slot d"><span class="n">Draws</span><span class="v" id="scoreD">0</span></div>
            <div class="slot o"><span class="n">Player O</span><span class="v" id="scoreO">0</span></div>
          </div>
          <div class="cabinet"><div class="board" id="board"></div></div>
          <div class="match-controls" id="hostMatchControls"></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-heading"><span class="dot"></span>Roster</div>
          <div class="roster" id="roster"></div>
          <div id="hostRequests"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="remoteAudioContainer" style="display:none;"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const uid = 'u_' + Math.random().toString(36).slice(2, 10);
  let ws = null;
  let myRole = null;
  let isHost = false;
  let state = null;
  const peers = {}; // user_id -> RTCPeerConnection
  let localStream = null;
  let micEnabled = false;
  let intentionalLeave = false;
  let lastCode = null, lastName = null;
  let reconnectAttempt = 0;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsBase = `${proto}://${location.host}/ws/`;

  function toast(msg){ $('entryToast').textContent = msg; }
  function roomToast(msg){ $('roomToast').textContent = msg; }

  $('createBtn').onclick = () => {
    const name = $('nameInput').value.trim() || 'Host';
    connect('NEW', name, 'create');
  };
  $('joinBtn').onclick = () => {
    const name = $('nameInput').value.trim() || 'Guest';
    const code = $('codeInput').value.trim().toUpperCase();
    if (!code) { toast('Enter a room code first.'); return; }
    connect(code, name, 'join');
  };
  $('leaveBtn').onclick = () => {
    intentionalLeave = true;
    send({type:'leave'});
    Object.values(peers).forEach(pc => pc.close());
    if (ws) ws.close();
    location.reload();
  };

  function connect(code, name, action){
    lastCode = code; lastName = name;
    ws = new WebSocket(`${wsBase}${encodeURIComponent(code)}?uid=${uid}&name=${encodeURIComponent(name)}&action=${action}`);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'heartbeat'){
        return;
      } else if (msg.type === 'joined'){
        reconnectAttempt = 0;
        roomToast('');
        $('entryCard').style.display = 'none';
        $('roomCard').style.display = 'block';
        $('codeBadge').textContent = msg.code;
        lastCode = msg.code;
      } else if (msg.type === 'room_state'){
        state = msg;
        render();
        handlePeers();
      } else if (msg.type === 'declined'){
        alert('The host declined your join request.');
        location.reload();
      } else if (msg.type === 'signal'){
        handleSignal(msg.from, msg.data);
      }
    };
    ws.onclose = () => {
      if (!state){
        toast('Could not reach that room.');
        return;
      }
      if (intentionalLeave) return;
      reconnectAttempt++;
      roomToast('Connection dropped — reconnecting…');
      setTimeout(() => {
        if (!intentionalLeave) connect(lastCode, lastName, 'join');
      }, Math.min(1500 * reconnectAttempt, 6000));
    };
  }

  function send(payload){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(payload)); }

  function render(){
    if (!state) return;
    isHost = state.host_id === uid;
    const me = state.participants.find(p => p.id === uid);
    myRole = me ? me.role : null;

    const boardEl = $('board');
    boardEl.innerHTML = '';
    state.board.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
      if (state.win_line && state.win_line.includes(i)) btn.classList.add('win');
      btn.textContent = val || '';
      const canPlay = state.status === 'playing' &&
        ((myRole === 'player_x' && state.turn === 'X') || (myRole === 'player_o' && state.turn === 'O'));
      btn.disabled = !!val || !canPlay;
      btn.onclick = () => send({type:'move', cell:i});
      boardEl.appendChild(btn);
    });

    $('scoreX').textContent = state.scores.X;
    $('scoreO').textContent = state.scores.O;
    $('scoreD').textContent = state.scores.draws;

    let statusText = '';
    if (state.status === 'lobby') statusText = 'Lobby — waiting for host to start the match';
    else if (state.status === 'playing') statusText = `<span class="${state.turn.toLowerCase()}">${state.turn}</span>'s turn`;
    else if (state.status === 'finished'){
      statusText = state.winner === 'draw' ? "It's a draw" : `<span class="${state.winner.toLowerCase()}">${state.winner}</span> wins!`;
    }
    $('statusLine').innerHTML = statusText;

    const hostControls = $('hostMatchControls');
    hostControls.innerHTML = '';
    if (isHost){
      const hasX = state.participants.some(p => p.role === 'player_x');
      const hasO = state.participants.some(p => p.role === 'player_o');
      if (state.status === 'lobby'){
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = 'Start match';
        b.disabled = !(hasX && hasO);
        b.onclick = () => send({type:'start_match'});
        hostControls.appendChild(b);
      } else if (state.status === 'finished'){
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = 'Play again';
        b.onclick = () => send({type:'play_again'});
        hostControls.appendChild(b);
      }
    }

    const roster = $('roster');
    roster.innerHTML = '';
    state.participants.forEach(p => {
      const row = document.createElement('div');
      row.className = 'person' + (p.connected === false ? ' offline' : '');
      row.id = 'person-' + p.id;
      const dot = document.createElement('div');
      dot.className = 'mic-dot' + (p.muted ? ' muted' : (p.id === uid && micEnabled ? ' on' : ''));
      row.appendChild(dot);
      const label = document.createElement('span');
      label.textContent = p.name + (p.id === uid ? ' (you)' : '');
      row.appendChild(label);
      if (p.connected === false){
        const off = document.createElement('span');
        off.className = 'offline-tag';
        off.textContent = 'reconnecting…';
        row.appendChild(off);
      }

      if (isHost && p.id !== uid){
        const sel = document.createElement('select');
        sel.className = 'host-controls';
        [['spectator','Spectator'],['player_x','Player X'],['player_o','Player O']].forEach(([v,l]) => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = l;
          if (p.role === v) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.onchange = () => send({type:'assign_role', user_id:p.id, role:sel.value});
        row.appendChild(sel);
      } else {
        const tag = document.createElement('span');
        tag.className = 'role-tag ' + p.role;
        tag.textContent = p.role === 'player_x' ? 'PLAYER X' : p.role === 'player_o' ? 'PLAYER O' : 'SPECTATOR';
        row.appendChild(tag);
      }
      if (p.id === state.host_id){
        const hostTag = document.createElement('span');
        hostTag.className = 'role-tag host';
        hostTag.textContent = 'HOST';
        row.appendChild(hostTag);
      }
      roster.appendChild(row);
    });

    const reqBox = $('hostRequests');
    reqBox.innerHTML = '';
    if (isHost && state.pending && state.pending.length){
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Join requests';
      reqBox.appendChild(label);
      state.pending.forEach(p => {
        const row = document.createElement('div');
        row.className = 'pending-item';
        row.innerHTML = `<span>${p.name}</span>`;
        const ok = document.createElement('button');
        ok.textContent = 'Accept';
        ok.onclick = () => send({type:'approve', user_id:p.id});
        const no = document.createElement('button');
        no.className = 'danger';
        no.textContent = 'Decline';
        no.onclick = () => send({type:'decline', user_id:p.id});
        row.appendChild(ok); row.appendChild(no);
        reqBox.appendChild(row);
      });
    }
  }

  $('micBtn').onclick = async () => {
    if (!micEnabled){
      try {
        localStream = await navigator.mediaDevices.getUserMedia({audio:true});
        micEnabled = true;
        $('micBtn').textContent = '🔴 Mute mic';
        send({type:'mute', muted:false});
        Object.values(peers).forEach(pc => {
          localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        });
        render();
      } catch(e){ alert('Microphone permission was denied.'); }
    } else {
      const track = localStream && localStream.getAudioTracks()[0];
      if (track){
        track.enabled = !track.enabled;
        $('micBtn').textContent = track.enabled ? '🔴 Mute mic' : '🎤 Unmute mic';
        send({type:'mute', muted: !track.enabled});
        render();
      }
    }
  };

  function makePeerConnection(peerId){
    const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    peers[peerId] = pc;
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = (e) => {
      if (e.candidate) send({type:'signal', target:peerId, data:{candidate:e.candidate}});
    };
    pc.ontrack = (e) => {
      let audioEl = document.getElementById('audio-' + peerId);
      if (!audioEl){
        audioEl = document.createElement('audio');
        audioEl.id = 'audio-' + peerId;
        audioEl.autoplay = true;
        $('remoteAudioContainer').appendChild(audioEl);
      }
      audioEl.srcObject = e.streams[0];
      watchSpeaking(peerId, e.streams[0]);
    };
    return pc;
  }

  function handlePeers(){
    if (!state) return;
    const others = state.participants.filter(p => p.id !== uid);
    others.forEach(p => {
      if (!peers[p.id] && uid < p.id){
        const pc = makePeerConnection(p.id);
        pc.createOffer().then(offer => {
          pc.setLocalDescription(offer);
          send({type:'signal', target:p.id, data:{sdp:offer}});
        });
      }
    });
    Object.keys(peers).forEach(pid => {
      if (!others.find(p => p.id === pid)){
        peers[pid].close();
        delete peers[pid];
        const el = document.getElementById('audio-' + pid);
        if (el) el.remove();
      }
    });
  }

  async function handleSignal(fromId, data){
    let pc = peers[fromId];
    if (!pc) pc = makePeerConnection(fromId);
    if (data.sdp){
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      if (data.sdp.type === 'offer'){
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({type:'signal', target:fromId, data:{sdp:answer}});
      }
    } else if (data.candidate){
      try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
    }
  }

  function watchSpeaking(peerId, stream){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      setInterval(() => {
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a,b) => a+b, 0) / data.length;
        const el = document.getElementById('person-' + peerId);
        if (el) el.classList.toggle('speaking', avg > 18);
      }, 200);
    } catch(e){}
  }
})();
</script>
