<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Arena — Multiplayer Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1226; --panel:#171B3A; --panel-edge:#2A2F58; --paper:#F4F1E8;
    --x-color:#3ED9C4; --o-color:#FF6B5F; --gold:#F2B705; --muted:#9AA0C3; --danger:#FF6B5F;
  }
  *{ box-sizing:border-box; }
  
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  @keyframes glow { 0%{box-shadow:0 0 0 0 currentColor} 70%{box-shadow:0 0 0 8px transparent} }
  @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
  
  body{
    margin:0; min-height:100vh; font-family:'Space Grotesk',sans-serif; color:var(--paper);
    background:
      radial-gradient(1100px 700px at 15% -10%, #232962 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #1B2050 0%, transparent 55%),
      var(--ink);
    display:flex; align-items:flex-start; justify-content:center; padding:28px 16px;
    overflow-x:hidden;
  }
  
  .wrap{ width:100%; max-width:920px; animation:fadeIn 0.6s ease-out; }
  
  h1{ 
    font-size:2.2rem; margin:0 0 8px; letter-spacing:-0.02em; font-weight:700;
    background:linear-gradient(135deg, var(--paper) 0%, var(--muted) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  h1 .x{ color:var(--x-color); -webkit-text-fill-color:var(--x-color); }
  h1 .o{ color:var(--o-color); -webkit-text-fill-color:var(--o-color); }
  .sub{ color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.8rem; margin-bottom:28px; letter-spacing:0.05em; }

  .card{ 
    background:linear-gradient(135deg, var(--panel) 0%, rgba(23,27,58,0.8) 100%);
    border:1px solid var(--panel-edge); border-radius:16px; padding:24px; margin-bottom:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3); animation:fadeIn 0.5s ease-out;
    transition:all 0.3s ease;
  }
  .card:hover{ border-color:rgba(242,183,5,0.3); box-shadow:0 12px 40px rgba(62,217,196,0.1); }
  
  input{
    width:100%; background:#0a0d1f; border:2px solid var(--panel-edge); color:var(--paper);
    padding:13px 14px; border-radius:10px; font-family:inherit; font-size:0.95rem; margin-bottom:12px;
    transition:all 0.3s ease;
  }
  input:focus{
    outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(242,183,5,0.15);
  }
  
  button{
    font-family:'JetBrains Mono',monospace; font-size:0.75rem; border-radius:10px; padding:12px 18px;
    cursor:pointer; border:2px solid var(--panel-edge); background:transparent; color:var(--paper);
    transition:all 0.25s ease; font-weight:600; letter-spacing:0.05em;
    position:relative; overflow:hidden;
  }
  button::before{
    content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition:left 0.5s ease;
  }
  button:hover:before{ left:100%; }
  button:hover:not(:disabled){ 
    border-color:var(--gold); color:var(--gold); 
    box-shadow:0 0 16px rgba(242,183,5,0.3); transform:translateY(-2px);
  }
  button:active:not(:disabled){ transform:translateY(0); }
  button:disabled{ opacity:0.35; cursor:default; }
  button.primary{ 
    background:linear-gradient(135deg, var(--gold) 0%, #e5a300 100%);
    color:#171B3A; border-color:var(--gold); font-weight:700; box-shadow:0 4px 16px rgba(242,183,5,0.3);
  }
  button.primary:hover:not(:disabled){ 
    box-shadow:0 6px 24px rgba(242,183,5,0.5); transform:translateY(-3px);
  }
  button.danger{ border-color:var(--danger); color:var(--danger); }
  button.danger:hover:not(:disabled){ box-shadow:0 0 16px rgba(255,107,95,0.3); }
  
  .row{ display:flex; gap:12px; flex-wrap:wrap; }

  .layout{ display:grid; grid-template-columns:1fr 280px; gap:18px; }
  @media (max-width:720px){ .layout{ grid-template-columns:1fr; } }

  .code-badge{
    font-family:'JetBrains Mono',monospace; font-size:1.6rem; letter-spacing:0.18em;
    color:var(--gold); background:#0a0d1f; border:2px dashed var(--panel-edge);
    padding:12px 18px; border-radius:10px; display:inline-block;
    font-weight:700; animation:slideIn 0.4s ease-out;
    box-shadow:0 0 16px rgba(242,183,5,0.15);
  }

  .status{ 
    text-align:center; font-size:1.15rem; margin:18px 0; min-height:28px;
    font-weight:600; animation:fadeIn 0.4s ease-out;
  }
  .status .x{ color:var(--x-color); font-weight:700; } 
  .status .o{ color:var(--o-color); font-weight:700; }

  .board{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; background:var(--panel-edge);
    border-radius:16px; padding:10px; max-width:380px; margin:0 auto; aspect-ratio:1;
    box-shadow:inset 0 4px 16px rgba(0,0,0,0.3);
  }
  .cell{
    background:linear-gradient(135deg, var(--panel) 0%, rgba(23,27,58,0.6) 100%);
    border:2px solid var(--panel-edge); border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:clamp(1.8rem,8vw,2.8rem); font-weight:700; cursor:pointer;
    color:var(--paper); transition:all 0.2s ease; position:relative;
  }
  .cell:hover:not(:disabled){ 
    border-color:var(--gold); box-shadow:0 0 12px rgba(242,183,5,0.2);
    transform:scale(1.05);
  }
  .cell:active:not(:disabled){ transform:scale(0.98); }
  .cell:disabled{ cursor:default; }
  .cell.x{ color:var(--x-color); font-weight:700; text-shadow:0 0 8px rgba(62,217,196,0.3); }
  .cell.o{ color:var(--o-color); font-weight:700; text-shadow:0 0 8px rgba(255,107,95,0.3); }
  .cell.win{ 
    background:linear-gradient(135deg, rgba(242,183,5,0.25) 0%, rgba(242,183,5,0.1) 100%);
    border-color:var(--gold); box-shadow:0 0 16px rgba(242,183,5,0.4), inset 0 0 16px rgba(242,183,5,0.2);
    animation:glow 2s infinite;
  }

  .scoreboard{ 
    display:flex; justify-content:center; gap:24px; margin:18px 0;
    font-family:'JetBrains Mono',monospace; font-size:0.88rem;
  }
  .scoreboard b{ font-size:1.3rem; font-weight:700; }
  .scoreboard .x b{ color:var(--x-color); }
  .scoreboard .o b{ color:var(--o-color); }
  .scoreboard .d b{ color:var(--gold); }
  .scoreboard > div{ 
    background:rgba(255,255,255,0.03); padding:8px 14px; border-radius:8px;
    border:1px solid var(--panel-edge); transition:all 0.3s ease;
  }
  .scoreboard > div:hover{ border-color:currentColor; }

  .roster{ display:flex; flex-direction:column; gap:10px; }
  .person{
    display:flex; align-items:center; gap:10px; background:rgba(17,20,44,0.8);
    border:1.5px solid var(--panel-edge); border-radius:10px; padding:10px 12px;
    font-size:0.85rem; transition:all 0.3s ease; animation:slideIn 0.4s ease-out;
  }
  .person:hover{ border-color:rgba(62,217,196,0.3); }
  .person.speaking{ 
    border-color:var(--gold); box-shadow:0 0 12px rgba(242,183,5,0.3), inset 0 0 8px rgba(242,183,5,0.1);
    background:rgba(242,183,5,0.08);
  }
  .role-tag{
    font-family:'JetBrains Mono',monospace; font-size:0.65rem; padding:3px 8px; border-radius:6px;
    margin-left:auto; white-space:nowrap; font-weight:600; letter-spacing:0.05em;
  }
  .role-tag.player_x{ background:rgba(62,217,196,0.2); color:var(--x-color); border:1px solid rgba(62,217,196,0.4); }
  .role-tag.player_o{ background:rgba(255,107,95,0.2); color:var(--o-color); border:1px solid rgba(255,107,95,0.4); }
  .role-tag.spectator{ background:rgba(154,160,195,0.15); color:var(--muted); border:1px solid rgba(154,160,195,0.3); }
  .role-tag.host{ background:rgba(242,183,5,0.2); color:var(--gold); border:1px solid rgba(242,183,5,0.4); }
  
  .mic-dot{ 
    width:9px; height:9px; border-radius:50%; background:#3d4270; flex-shrink:0;
    transition:all 0.2s ease; box-shadow:0 0 4px rgba(61,66,112,0.4);
  }
  .mic-dot.muted{ background:var(--danger); box-shadow:0 0 6px rgba(255,107,95,0.4); }
  .mic-dot.on{ background:var(--x-color); box-shadow:0 0 8px rgba(62,217,196,0.6); animation:pulse 1s ease-in-out infinite; }
  
  .person.offline{ opacity:0.5; }
  .person .offline-tag{ 
    font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--muted);
    margin-left:auto; background:rgba(255,107,95,0.1); padding:2px 6px; border-radius:4px;
  }

  .host-controls{
    background:#0a0d1f; color:var(--paper); border:1.5px solid var(--panel-edge); border-radius:8px;
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; padding:4px 8px;
    cursor:pointer; transition:all 0.2s ease;
  }
  .host-controls:focus{ outline:none; border-color:var(--gold); }
  .host-controls:hover{ border-color:var(--gold); }
  
  .pending-item{ 
    display:flex; align-items:center; gap:8px; padding:8px; background:rgba(255,107,95,0.08);
    border:1px solid rgba(255,107,95,0.3); border-radius:8px; animation:slideIn 0.4s ease-out;
  }
  .pending-item button{ flex:1; margin:0 3px; }
  
  .section-label{ 
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted);
    margin:16px 0 10px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600;
  }
  .hint{ color:var(--muted); font-size:0.8rem; line-height:1.6; }
  
  .toast{ 
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:0.75rem;
    color:var(--gold); min-height:20px; animation:fadeIn 0.3s ease-out;
    letter-spacing:0.05em;
  }
  
  #entryCard{ animation:fadeIn 0.6s ease-out; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="x">X</span>/<span class="o">O</span> Nexus Arena</h1>
  <div class="sub">rooms · spectators · live voice</div>

  <!-- ENTRY SCREEN -->
  <div class="card" id="entryCard">
    <input id="nameInput" placeholder="Your display name" maxlength="24">
    <div class="row">
      <button class="primary" id="createBtn">Create a room</button>
    </div>
    <div class="section-label">— or join an existing room —</div>
    <input id="codeInput" placeholder="Room code" maxlength="8" style="text-transform:uppercase">
    <button id="joinBtn">Request to join</button>
    <div class="toast" id="entryToast"></div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="roomCard" style="display:none;">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div>Room code: <span class="code-badge" id="codeBadge"></span></div>
        <div class="row">
          <button id="micBtn">🎤 Enable mic</button>
          <button class="danger" id="leaveBtn">Leave room</button>
        </div>
      </div>
      <div class="toast" id="roomToast"></div>
    </div>

    <div class="layout">
      <div>
        <div class="card">
          <div class="status" id="statusLine">Waiting in lobby…</div>
          <div class="scoreboard">
            <div class="x">X <b id="scoreX">0</b></div>
            <div class="d">Draws <b id="scoreD">0</b></div>
            <div class="o">O <b id="scoreO">0</b></div>
          </div>
          <div class="board" id="board"></div>
          <div class="row" style="justify-content:center; margin-top:18px;" id="hostMatchControls"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Roster</div>
        <div class="roster" id="roster"></div>

        <div id="hostRequests"></div>
      </div>
    </div>
  </div>

  <div id="remoteAudioContainer"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const uid = 'u_' + Math.random().toString(36).slice(2, 10);
  let ws = null;
  let myRole = null;
  let isHost = false;
  let state = null;
  const peers = {}; // user_id -> RTCPeerConnection
  let localStream = null;
  let micEnabled = false;
  let intentionalLeave = false;
  let lastCode = null, lastName = null;
  let reconnectAttempt = 0;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wsBase = `${proto}://${location.host}/ws/`;

  function toast(msg){ $('entryToast').textContent = msg; }
  function roomToast(msg){ $('roomToast').textContent = msg; }

  $('createBtn').onclick = () => {
    const name = $('nameInput').value.trim() || 'Host';
    connect('NEW', name, 'create');
  };
  $('joinBtn').onclick = () => {
    const name = $('nameInput').value.trim() || 'Guest';
    const code = $('codeInput').value.trim().toUpperCase();
    if (!code) { toast('Enter a room code first.'); return; }
    connect(code, name, 'join');
  };
  $('leaveBtn').onclick = () => {
    intentionalLeave = true;
    send({type:'leave'});
    Object.values(peers).forEach(pc => pc.close());
    if (ws) ws.close();
    location.reload();
  };

  function connect(code, name, action){
    lastCode = code; lastName = name;
    ws = new WebSocket(`${wsBase}${encodeURIComponent(code)}?uid=${uid}&name=${encodeURIComponent(name)}&action=${action}`);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'heartbeat'){
        return;
      } else if (msg.type === 'joined'){
        reconnectAttempt = 0;
        roomToast('');
        $('entryCard').style.display = 'none';
        $('roomCard').style.display = 'block';
        $('codeBadge').textContent = msg.code;
        lastCode = msg.code;
      } else if (msg.type === 'room_state'){
        state = msg;
        render();
        handlePeers();
      } else if (msg.type === 'declined'){
        alert('The host declined your join request.');
        location.reload();
      } else if (msg.type === 'signal'){
        handleSignal(msg.from, msg.data);
      }
    };
    ws.onclose = () => {
      if (!state){
        toast('Could not reach that room.');
        return;
      }
      if (intentionalLeave) return;
      reconnectAttempt++;
      roomToast('Connection dropped — reconnecting…');
      setTimeout(() => {
        if (!intentionalLeave) connect(lastCode, lastName, 'join');
      }, Math.min(1500 * reconnectAttempt, 6000));
    };
  }

  function send(payload){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(payload)); }

  function render(){
    if (!state) return;
    isHost = state.host_id === uid;
    const me = state.participants.find(p => p.id === uid);
    myRole = me ? me.role : null;

    // Board
    const boardEl = $('board');
    boardEl.innerHTML = '';
    state.board.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
      if (state.win_line && state.win_line.includes(i)) btn.classList.add('win');
      btn.textContent = val || '';
      const canPlay = state.status === 'playing' &&
        ((myRole === 'player_x' && state.turn === 'X') || (myRole === 'player_o' && state.turn === 'O'));
      btn.disabled = !!val || !canPlay;
      btn.onclick = () => send({type:'move', cell:i});
      boardEl.appendChild(btn);
    });

    $('scoreX').textContent = state.scores.X;
    $('scoreO').textContent = state.scores.O;
    $('scoreD').textContent = state.scores.draws;

    let statusText = '';
    if (state.status === 'lobby') statusText = 'Lobby — waiting for host to start the match';
    else if (state.status === 'playing') statusText = `<span class="${state.turn.toLowerCase()}">${state.turn}</span>'s turn`;
    else if (state.status === 'finished'){
      statusText = state.winner === 'draw' ? "It's a draw" : `<span class="${state.winner.toLowerCase()}">${state.winner}</span> wins!`;
    }
    $('statusLine').innerHTML = statusText;

    // Host match controls
    const hostControls = $('hostMatchControls');
    hostControls.innerHTML = '';
    if (isHost){
      const hasX = state.participants.some(p => p.role === 'player_x');
      const hasO = state.participants.some(p => p.role === 'player_o');
      if (state.status === 'lobby'){
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = 'Start match';
        b.disabled = !(hasX && hasO);
        b.onclick = () => send({type:'start_match'});
        hostControls.appendChild(b);
      } else if (state.status === 'finished'){
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = 'Play again';
        b.onclick = () => send({type:'play_again'});
        hostControls.appendChild(b);
      }
    }

    // Roster
    const roster = $('roster');
    roster.innerHTML = '';
    state.participants.forEach(p => {
      const row = document.createElement('div');
      row.className = 'person' + (p.connected === false ? ' offline' : '');
      row.id = 'person-' + p.id;
      const dot = document.createElement('div');
      dot.className = 'mic-dot' + (p.muted ? ' muted' : (p.id === uid && micEnabled ? ' on' : ''));
      row.appendChild(dot);
      const label = document.createElement('span');
      label.textContent = p.name + (p.id === uid ? ' (you)' : '');
      row.appendChild(label);
      if (p.connected === false){
        const off = document.createElement('span');
        off.className = 'offline-tag';
        off.textContent = 'reconnecting…';
        row.appendChild(off);
      }

      if (isHost && p.id !== uid){
        const sel = document.createElement('select');
        sel.className = 'host-controls';
        [['spectator','Spectator'],['player_x','Player X'],['player_o','Player O']].forEach(([v,l]) => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = l;
          if (p.role === v) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.onchange = () => send({type:'assign_role', user_id:p.id, role:sel.value});
        row.appendChild(sel);
      } else {
        const tag = document.createElement('span');
        tag.className = 'role-tag ' + p.role;
        tag.textContent = p.role === 'player_x' ? 'PLAYER X' : p.role === 'player_o' ? 'PLAYER O' : 'SPECTATOR';
        row.appendChild(tag);
      }
      if (p.id === state.host_id){
        const hostTag = document.createElement('span');
        hostTag.className = 'role-tag host';
        hostTag.textContent = 'HOST';
        row.appendChild(hostTag);
      }
      roster.appendChild(row);
    });

    // Pending join requests (host only)
    const reqBox = $('hostRequests');
    reqBox.innerHTML = '';
    if (isHost && state.pending && state.pending.length){
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Join requests';
      reqBox.appendChild(label);
      state.pending.forEach(p => {
        const row = document.createElement('div');
        row.className = 'pending-item';
        row.innerHTML = `<span>${p.name}</span>`;
        const ok = document.createElement('button');
        ok.textContent = 'Accept';
        ok.onclick = () => send({type:'approve', user_id:p.id});
        const no = document.createElement('button');
        no.className = 'danger';
        no.textContent = 'Decline';
        no.onclick = () => send({type:'decline', user_id:p.id});
        row.appendChild(ok); row.appendChild(no);
        reqBox.appendChild(row);
      });
    }
  }

  // ---- Mic / WebRTC voice mesh ----
  $('micBtn').onclick = async () => {
    if (!micEnabled){
      try {
        localStream = await navigator.mediaDevices.getUserMedia({audio:true});
        micEnabled = true;
        $('micBtn').textContent = '🔴 Mute mic';
        send({type:'mute', muted:false});
        Object.values(peers).forEach(pc => {
          localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        });
        render();
      } catch(e){ alert('Microphone permission was denied.'); }
    } else {
      const track = localStream && localStream.getAudioTracks()[0];
      if (track){
        track.enabled = !track.enabled;
        $('micBtn').textContent = track.enabled ? '🔴 Mute mic' : '🎤 Unmute mic';
        send({type:'mute', muted: !track.enabled});
        render();
      }
    }
  };

  function makePeerConnection(peerId){
    const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    peers[peerId] = pc;
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.onicecandidate = (e) => {
      if (e.candidate) send({type:'signal', target:peerId, data:{candidate:e.candidate}});
    };
    pc.ontrack = (e) => {
      let audioEl = document.getElementById('audio-' + peerId);
      if (!audioEl){
        audioEl = document.createElement('audio');
        audioEl.id = 'audio-' + peerId;
        audioEl.autoplay = true;
        $('remoteAudioContainer').appendChild(audioEl);
      }
      audioEl.srcObject = e.streams[0];
      watchSpeaking(peerId, e.streams[0]);
    };
    return pc;
  }

  function handlePeers(){
    if (!state) return;
    const others = state.participants.filter(p => p.id !== uid);
    others.forEach(p => {
      if (!peers[p.id] && uid < p.id){
        const pc = makePeerConnection(p.id);
        pc.createOffer().then(offer => {
          pc.setLocalDescription(offer);
          send({type:'signal', target:p.id, data:{sdp:offer}});
        });
      }
    });
    // Clean up peers who left
    Object.keys(peers).forEach(pid => {
      if (!others.find(p => p.id === pid)){
        peers[pid].close();
        delete peers[pid];
        const el = document.getElementById('audio-' + pid);
        if (el) el.remove();
      }
    });
  }

  async function handleSignal(fromId, data){
    let pc = peers[fromId];
    if (!pc) pc = makePeerConnection(fromId);
    if (data.sdp){
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      if (data.sdp.type === 'offer'){
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({type:'signal', target:fromId, data:{sdp:answer}});
      }
    } else if (data.candidate){
      try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
    }
  }

  function watchSpeaking(peerId, stream){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      setInterval(() => {
        analyser.getByteFrequencyData(data);
        const avg = data.reduce((a,b) => a+b, 0) / data.length;
        const el = document.getElementById('person-' + peerId);
        if (el) el.classList.toggle('speaking', avg > 18);
      }, 200);
    } catch(e){}
  }
})();
</script>
</body>
